<body>
    <div class="gis-filter-page">
        <div class="gis-filter-card">
            <div class="gis-filter-head">
                <h1 class="gis-filter-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2" /><circle cx="19" cy="6" r="2" /><path d="M7 17.5c4 0 4-11 8-11h2" /></svg>
                    تنظیمات جستجوی اطلاعات مسیر ها
                </h1>
                <div class="gis-filter-actions">
                    <button id="btn-Search" class="btn btn-primary" data-target="widgets" title="اعمال شرط‌ها و نمایش نتیجه روی نقشه">جستجوی اطلاعات</button>
                    <button id="btn-set" class="btn btn-default" data-target="widgets" title="بازگرداندن شرط‌هایی که آخرین بار اعمال شده‌اند">پیش فرض شرایط</button>
                    <button id="btn-reset" class="btn btn-danger-soft" data-target="widgets" title="پاک کردن همهٔ شرط‌ها">حذف شرایط</button>
                </div>
            </div>
            <div class="gis-filter-body">
                <div id="builder-widgets"></div>
            </div>
            <div class="gis-filter-hint">
                شرط‌ها را با «و / یا» ترکیب کنید؛ با «افزودن مجموعه شرط» می‌توانید پرانتز بسازید. در پایان «جستجوی اطلاعات» را بزنید.
            </div>
        </div>
    </div>
